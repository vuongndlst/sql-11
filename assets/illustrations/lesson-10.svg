<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc"><title id="title">Bảng con cần bản ghi cha</title><desc id="desc">Cha: người 1: Có trong danh mục → Con: lượt mượn: FK = 1 được chấp nhận → Cha: người 999?: Không có → từ chối FK</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#17676d"/></marker></defs><rect width="960" height="230" rx="20" fill="#f5f7f2"/><text x="28" y="35" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#173e44">Bảng con cần bản ghi cha</text><rect x="41.5" y="68" width="275" height="106" rx="13" fill="#d7efef" stroke="#17676d"/><circle cx="64.5" cy="91" r="13" fill="#17676d"/><text x="64.5" y="96" text-anchor="middle" font-family="Arial" font-size="14" fill="white">1</text><text x="179.0" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#173e44">Cha: người 1</text><text x="179.0" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173e44">Có trong danh mục</text><path d="M319.5 112h20" stroke="#17676d" stroke-width="2" marker-end="url(#arrow)"/><rect x="342.5" y="68" width="275" height="106" rx="13" fill="#e7f3bd" stroke="#17676d"/><circle cx="365.5" cy="91" r="13" fill="#17676d"/><text x="365.5" y="96" text-anchor="middle" font-family="Arial" font-size="14" fill="white">2</text><text x="480.0" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#173e44">Con: lượt mượn</text><text x="480.0" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173e44">FK = 1 được chấp nhận</text><path d="M620.5 112h20" stroke="#17676d" stroke-width="2" marker-end="url(#arrow)"/><rect x="643.5" y="68" width="275" height="106" rx="13" fill="#fff0cc" stroke="#17676d"/><circle cx="666.5" cy="91" r="13" fill="#17676d"/><text x="666.5" y="96" text-anchor="middle" font-family="Arial" font-size="14" fill="white">3</text><text x="781.0" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#173e44">Cha: người 999?</text><text x="781.0" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173e44">Không có → từ chối FK</text><text x="28" y="212" font-family="Arial,sans-serif" font-size="14" fill="#53696d">Sơ đồ khái niệm · dữ liệu và tình huống mô phỏng</text></svg>